{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
    }

    .login-container {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* LEFT SIDE */
    .login-left {
      flex: 1.2;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 60px;
      justify-content: center;
      align-items: center;
      background-image: url("{% static 'images/it_assets_isometric.png' %}");
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }
    
    .login-left-content {
      position: absolute;
      top: 60px;
      left: 60px;
      z-index: 2;
    }

    .login-left h1 {
      font-size: 42px;
      font-weight: 700;
      color: #1a2a40;
      line-height: 1.2;
    }

    .login-left h1 span {
      color: #0d5cff;
    }

    .login-left .features {
      margin-top: 15px;
      font-size: 16px;
      color: #6c757d;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .features span.dot {
      width: 5px;
      height: 5px;
      background-color: #0d5cff;
      border-radius: 50%;
    }

    /* RIGHT SIDE */
    .login-right {
      flex: 1;
      background-color: #ffffff;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-right-inner {
      max-width: 450px;
      width: 100%;
      margin: 0 auto;
    }

    .login-right h2 {
      color: #0f172a;
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .login-right .subtitle {
      color: #64748b;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 35px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    
    .form-group label {
      display: block;
      color: #64748b;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i.input-icon {
      position: absolute;
      left: 15px;
      color: #94a3b8;
      font-size: 16px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 40px 14px 45px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      font-size: 15px;
      color: #0f172a;
      outline: none;
      transition: all 0.3s;
    }

    .form-group input:focus {
      border-color: #0d5cff;
      box-shadow: 0 0 0 3px rgba(13, 92, 255, 0.1);
    }

    .password-toggle {
      position: absolute;
      right: 15px;
      font-size: 16px;
      color: #94a3b8;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .password-toggle:hover {
      color: #0d5cff;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      margin-bottom: 25px;
      margin-top: 10px;
    }

    .checkbox-group input {
      margin-right: 10px;
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #0d5cff;
    }

    .checkbox-group label {
      font-size: 14px;
      color: #64748b;
      cursor: pointer;
    }

    .checkbox-group a {
      color: #0d5cff;
      text-decoration: none;
      font-weight: 500;
    }

    .login-btn {
      width: 100%;
      background: #0d5cff;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 15px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
      box-shadow: 0 4px 14px rgba(13, 92, 255, 0.2);
    }

    .login-btn:hover {
      background: #0046d6;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(13, 92, 255, 0.25);
    }

    .bottom-text {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      color: #64748b;
    }

    .bottom-text a {
      color: #0d5cff;
      text-decoration: none;
      font-weight: 600;
      margin-left: 5px;
    }

    @media (max-width: 992px) {
      .login-container {
        flex-direction: column;
      }
      .login-left {
        flex: none;
        height: 300px;
        background-size: cover;
      }
      .login-left-content {
        top: 30px;
        left: 30px;
      }
      .login-right {
        padding: 40px 30px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- LEFT SIDE -->
    <div class="login-left">
      <div class="login-left-content">
        <h1>IT Asset<br><span>Management</span></h1>
        <div class="features">
          Track <span class="dot"></span> Assign <span class="dot"></span> Manage <span class="dot"></span> Secure
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="login-right">
      <div class="login-right-inner">
        <h2>Sign in</h2>
        <p class="subtitle">Welcome to IT Asset Management System.<br>Login to get started.</p>

        <form action="/login/" method="POST">
          {% csrf_token %}
          <div class="form-group">
            <label>Username</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="text" name="username" placeholder="Enter your username" required>
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="password" name="password" placeholder="••••••••••••" required>
              <i class="fa-regular fa-eye password-toggle" id="togglePassword"></i>
            </div>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="terms" required>
            <label for="terms">I agree to the <a href="#">terms of service</a></label>
          </div>

          <button type="submit" class="login-btn" id="loginBtn">
            <span id="btnText">Sign in</span>
            <i class="fa-solid fa-circle-notch fa-spin" style="display: none; margin-left: 8px;" id="loginSpinner"></i>
          </button>
        </form>
        
        <div class="bottom-text">
          Don't have an account? <a href="#">Contact Admin</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const togglePassword = document.getElementById("togglePassword");
    const password = document.getElementById("password");

    togglePassword.addEventListener("click", function () {
      const type = password.getAttribute("type") === "password" ? "text" : "password";
      password.setAttribute("type", type);
      this.classList.toggle("fa-eye-slash");
    });

    const loginForm = document.querySelector("form");
    const loginBtn = document.getElementById("loginBtn");
    const loginSpinner = document.getElementById("loginSpinner");

    loginForm.addEventListener("submit", function () {
      loginBtn.disabled = true;
      loginBtn.style.opacity = "0.8";
      loginSpinner.style.display = "inline-block";
    });
  </script>

</body>
</html>
