{% extends 'asset_app/base.html' %}
{% block title %}Request Asset | IT Asset Management{% endblock %}

{% block content %}
<style>
    .page-bg {
        background-color: #f4f7fe;
        min-height: calc(100vh - 80px);
        padding: 2.5rem;
        font-family: 'Inter', sans-serif;
    }

    .form-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 2.5rem;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
        border: 1px solid #f1f5f9;
        max-width: 650px;
        margin: 0 auto;
    }

    .form-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .form-header-icon {
        width: 64px;
        height: 64px;
        background: #eff6ff;
        color: #2563eb;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
        margin-bottom: 1rem;
    }

    .form-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 0.5rem;
    }

    .form-subtitle {
        color: #64748b;
        font-size: 0.9rem;
    }

    .custom-label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #475569;
        margin-bottom: 0.5rem;
        display: block;
    }

    .custom-input {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        font-size: 0.95rem;
        color: #1e293b;
        width: 100%;
        transition: all 0.2s ease;
    }

    .custom-input:focus {
        background: #ffffff;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        outline: none;
    }

    .submit-btn {
        background: #2563eb;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.95rem;
        width: 100%;
        transition: all 0.2s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
    }

    .submit-btn:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
        color: white;
    }

    .back-btn {
        background: #f1f5f9;
        color: #475569;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.95rem;
        width: 100%;
        transition: all 0.2s ease;
        text-decoration: none;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
    }

    .back-btn:hover {
        background: #e2e8f0;
        color: #1e293b;
    }
</style>

<div class="page-bg">
    <div class="form-card">
        <div class="form-header">
            <div class="form-header-icon">
                <i class="bi bi-cart-plus"></i>
            </div>
            <h2 class="form-title">Request a New Asset</h2>
            <div class="form-subtitle">Submit a request to the IT department for new hardware or software.</div>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="custom-label">Asset Type <span class="text-danger">*</span></label>
                <input type="text" name="asset_type" class="custom-input" placeholder="e.g., MacBook Pro M3, Monitor, Keyboard..." required>
            </div>
            
            <div class="mb-4">
                <label class="custom-label">Business Justification / Description <span class="text-danger">*</span></label>
                <textarea name="description" rows="4" class="custom-input" placeholder="Please provide details about why this asset is required..." required></textarea>
            </div>
            
            <div class="row g-3 mt-2">
                <div class="col-sm-6">
                    <a href="{% url 'procurement_list' %}" class="back-btn">
                        <i class="bi bi-arrow-left"></i> Cancel
                    </a>
                </div>
                <div class="col-sm-6">
                    <button type="submit" class="submit-btn">
                        Submit Request <i class="bi bi-send ms-1"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
